name: 전체 검증

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: PHP 설정
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
        env:
          fail-fast: true

      - name: Laravel 환경 파일 준비
        run: cp .env.example .env

      - name: Composer 의존성 설치
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 애플리케이션 키 생성
        run: php artisan key:generate --ansi

      - name: Laravel 테스트
        run: php artisan test

      - name: Pint 검사
        run: vendor/bin/pint --test

  frontend:
    name: 프론트엔드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v6

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: 프론트엔드 테스트
        run: npm test

      - name: TypeScript 검사
        run: npx tsc --noEmit

      - name: ESLint 검사
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build
