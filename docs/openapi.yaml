components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum SPA 세션 쿠키. 실제 쿠키 이름은 배포 설정으로 변경할 수 있습니다.
  headers:
    ETag:
      description: 현재 자원의 정수 version을 따옴표로 감싼 값
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CropId:
      name: cropId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WateringScheduleId:
      name: wateringScheduleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WateringLogId:
      name: wateringLogId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 마지막으로 조회한 자원의 ETag 값
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: 새 격자 생성 시 생략하고 기존 격자 교체 시 마지막 ETag 값을 전송
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        examples: ['"3"']
  responses:
    Unauthenticated:
      description: 인증이 필요하거나 토큰이 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 자원에 접근할 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 자원을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 현재 자원 상태 또는 관계와 요청이 충돌함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match 버전이 현재 자원의 버전과 달라 변경을 적용하지 않음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CsrfMismatch:
      description: CSRF 쿠키 또는 요청 헤더 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, nickname, password, passwordConfirmation]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        password:
          type: string
          format: password
          minLength: 8
        passwordConfirmation:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    UserRole:
      type: string
      enum: [member, admin]
    User:
      type: object
      required: [id, email, nickname, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time

    GrowingSpaceType:
      type: string
      enum: [indoor, balcony, garden]
    SunlightExposure:
      type: string
      enum: [low, partial, full]
    SpaceOrientation:
      type: string
      enum: [open, north, northeast, east, southeast, south, southwest, west, northwest]
    GrowingSpaceInput:
      type: object
      required: [name, type, sunlight, widthCm, lengthCm, notes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        type:
          $ref: '#/components/schemas/GrowingSpaceType'
        sunlight:
          $ref: '#/components/schemas/SunlightExposure'
        widthCm:
          type: integer
          minimum: 10
          maximum: 100000
        lengthCm:
          type: integer
          minimum: 10
          maximum: 100000
        address:
          type: [string, 'null']
          maxLength: 255
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        orientation:
          oneOf:
            - $ref: '#/components/schemas/SpaceOrientation'
            - type: 'null'
        estimatedSunlightHours:
          type: [number, 'null']
          minimum: 0
          maximum: 24
        notes:
          type: string
          maxLength: 1000
    GrowingSpacePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        type:
          $ref: '#/components/schemas/GrowingSpaceType'
        sunlight:
          $ref: '#/components/schemas/SunlightExposure'
        widthCm:
          type: integer
          minimum: 10
          maximum: 100000
        lengthCm:
          type: integer
          minimum: 10
          maximum: 100000
        address:
          type: [string, 'null']
          maxLength: 255
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        orientation:
          oneOf:
            - $ref: '#/components/schemas/SpaceOrientation'
            - type: 'null'
        estimatedSunlightHours:
          type: [number, 'null']
          minimum: 0
          maximum: 24
        notes:
          type: string
          maxLength: 1000
    GrowingSpace:
      allOf:
        - $ref: '#/components/schemas/GrowingSpaceInput'
        - type: object
          required: [id, version, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
              minimum: 1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    GrowingSpaceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GrowingSpace'

    GrowingSeasonStatus:
      type: string
      enum: [planned, active, completed]
    GrowingSeasonInput:
      type: object
      required: [spaceId, name, startDate, endDate, notes]
      properties:
        spaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 30
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 1000
        featuredCropId:
          type: string
