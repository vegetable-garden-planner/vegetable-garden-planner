openapi: 3.1.0
info:
  title: 심어봄 API
  version: 0.1.0
  description: |
    심어봄 Next.js 프론트엔드와 향후 Laravel 백엔드 사이의 MVP 계약 초안입니다.
    현재 백엔드는 구현되지 않았으며 모든 operation은 계획 상태입니다.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel 로컬 개발 서버
tags:
  - name: Auth
    description: 회원 인증
  - name: Crops
    description: 공개 작물 기준 데이터
  - name: Spaces
    description: 사용자 재배 공간
  - name: Seasons
    description: 사용자 재배 시즌
  - name: Layouts
    description: 시즌별 텃밭 격자와 작물 배치

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: 회원가입
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입과 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인과 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 현재 인증 토큰 폐기
      operationId: logout
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /me:
    get:
      tags: [Auth]
      summary: 로그인 사용자 조회
      operationId: getCurrentUser
      responses:
        '200':
          description: 사용자 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /crops:
    get:
      tags: [Crops]
      summary: 작물 목록 조회
      operationId: listCrops
      security: []
      parameters:
        - name: query
          in: query
          description: 이름, 과명과 설명 검색어
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/CropCategory'
        - name: space
          in: query
          schema:
            $ref: '#/components/schemas/GrowingSpaceType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 작물 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Crop'
  /crops/{cropId}:
    get:
      tags: [Crops]
      summary: 작물 한 건 조회
      operationId: getCrop
      security: []
      parameters:
        - $ref: '#/components/parameters/CropId'
      responses:
        '200':
          description: 작물 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Crop'
        '404':
          $ref: '#/components/responses/NotFound'

  /spaces:
    get:
      tags: [Spaces]
      summary: 내 재배 공간 목록 조회
      operationId: listSpaces
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 공간 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GrowingSpace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Spaces]
      summary: 재배 공간 등록
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSpaceInput'
      responses:
        '201':
          description: 공간 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Spaces]
      summary: 내 재배 공간 한 건 조회
      operationId: getSpace
      responses:
        '200':
          description: 공간 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Spaces]
      summary: 재배 공간 일부 수정
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSpacePatch'
      responses:
        '200':
          description: 공간 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Spaces]
      summary: 재배 공간 삭제
      operationId: deleteSpace
      responses:
        '204':
          description: 공간 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /seasons:
    get:
      tags: [Seasons]
      summary: 내 재배 시즌 목록 조회
      operationId: listSeasons
      parameters:
        - name: spaceId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GrowingSeasonStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 시즌 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GrowingSeason'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Seasons]
      summary: 재배 시즌 등록
      operationId: createSeason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSeasonInput'
      responses:
        '201':
          description: 시즌 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /seasons/{seasonId}:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Seasons]
      summary: 내 재배 시즌 한 건 조회
      operationId: getSeason
      responses:
        '200':
          description: 시즌 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Seasons]
      summary: 재배 시즌 일부 수정
      operationId: updateSeason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSeasonPatch'
      responses:
        '200':
          description: 시즌 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Seasons]
      summary: 재배 시즌 삭제
      operationId: deleteSeason
      responses:
        '204':
          description: 시즌 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /seasons/{seasonId}/layout:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Layouts]
      summary: 시즌 격자와 작물 배치 조회
      operationId: getSeasonLayout
      responses:
        '200':
          description: 격자 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenLayoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Layouts]
      summary: 시즌 격자와 전체 작물 배치 저장
      operationId: putSeasonLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GardenLayoutInput'
      responses:
        '200':
          description: 기존 격자 교체 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenLayoutResponse'
        '201':
          description: 새 격자 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenLayoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Layouts]
      summary: 시즌 격자와 작물 배치 삭제
      operationId: deleteSeasonLayout
      responses:
        '204':
          description: 격자 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CropId:
      name: cropId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: 인증이 필요하거나 토큰이 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 자원에 접근할 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 자원을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 현재 자원 상태 또는 관계와 요청이 충돌함
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, nickname, password, passwordConfirmation]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        nickname:
          type: string
          minLength: 2
          maxLength: 20
        password:
          type: string
          format: password
          minLength: 8
        passwordConfirmation:
          type: string
          format: password
          minLength: 8
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, tokenType, user]
          properties:
            token:
              type: string
            tokenType:
              type: string
              const: Bearer
            user:
              $ref: '#/components/schemas/User'
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, nickname, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        createdAt:
          type: string
          format: date-time

    GrowingSpaceType:
      type: string
      enum: [indoor, balcony, garden]
    SunlightExposure:
      type: string
      enum: [low, partial, full]
    GrowingSpaceInput:
      type: object
      required: [name, type, sunlight, widthCm, lengthCm, region, notes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        type:
          $ref: '#/components/schemas/GrowingSpaceType'
        sunlight:
          $ref: '#/components/schemas/SunlightExposure'
        widthCm:
          type: integer
          minimum: 10
          maximum: 100000
        lengthCm:
          type: integer
          minimum: 10
          maximum: 100000
        region:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 1000
    GrowingSpacePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        type:
          $ref: '#/components/schemas/GrowingSpaceType'
        sunlight:
          $ref: '#/components/schemas/SunlightExposure'
        widthCm:
          type: integer
          minimum: 10
          maximum: 100000
        lengthCm:
          type: integer
          minimum: 10
          maximum: 100000
        region:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 1000
    GrowingSpace:
      allOf:
        - $ref: '#/components/schemas/GrowingSpaceInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    GrowingSpaceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GrowingSpace'

    GrowingSeasonStatus:
      type: string
      enum: [planned, active, completed]
    GrowingSeasonInput:
      type: object
      required: [spaceId, name, startDate, endDate, notes]
      properties:
        spaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 30
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 1000
    GrowingSeasonPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        spaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 30
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string
          maxLength: 1000
    GrowingSeason:
      allOf:
        - $ref: '#/components/schemas/GrowingSeasonInput'
        - type: object
          required: [id, status, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/GrowingSeasonStatus'
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    GrowingSeasonResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GrowingSeason'

    CropCategory:
      type: string
      enum: [leaf, fruit, root, legume, tuber]
    CropDifficulty:
      type: string
      enum: [easy, normal, challenging]
    PlantingMaterial:
      type: string
      enum: [seed, seedling, seed-potato]
    CropPeriod:
      type: object
      required: [startMonth, endMonth, label]
      properties:
        startMonth:
          type: integer
          minimum: 1
          maximum: 12
        endMonth:
          type: integer
          minimum: 1
          maximum: 12
        label:
          type: string
    Crop:
      type: object
      required:
        - id
        - name
        - familyName
        - category
        - difficulty
        - plantingMaterial
        - supportedSpaces
        - plantingPeriod
        - harvestPeriod
        - plantSpacingCm
        - summary
        - sourceId
      properties:
        id:
          type: string
        name:
          type: string
        familyName:
          type: string
        category:
          $ref: '#/components/schemas/CropCategory'
        difficulty:
          $ref: '#/components/schemas/CropDifficulty'
        plantingMaterial:
          $ref: '#/components/schemas/PlantingMaterial'
        supportedSpaces:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/GrowingSpaceType'
        plantingPeriod:
          $ref: '#/components/schemas/CropPeriod'
        harvestPeriod:
          $ref: '#/components/schemas/CropPeriod'
        plantSpacingCm:
          type: integer
          minimum: 1
        summary:
          type: string
        sourceId:
          type: string

    CropPlacement:
      type: object
      additionalProperties: false
      required: [cellIndex, cropId]
      properties:
        cellIndex:
          type: integer
          minimum: 0
        cropId:
          type: string
    GardenLayoutInput:
      type: object
      additionalProperties: false
      required: [spaceWidthCm, spaceLengthCm, cellSizeCm, placements]
      properties:
        spaceWidthCm:
          type: integer
          minimum: 10
        spaceLengthCm:
          type: integer
          minimum: 10
        cellSizeCm:
          type: integer
          enum: [10, 25, 50, 100]
        placements:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/CropPlacement'
    GardenLayout:
      type: object
      required:
        - seasonId
        - spaceId
        - spaceWidthCm
        - spaceLengthCm
        - cellSizeCm
        - columns
        - rows
        - placements
        - updatedAt
      properties:
        seasonId:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        spaceWidthCm:
          type: integer
          minimum: 10
        spaceLengthCm:
          type: integer
          minimum: 10
        cellSizeCm:
          type: integer
          enum: [10, 25, 50, 100]
        columns:
          type: integer
          minimum: 1
          maximum: 400
        rows:
          type: integer
          minimum: 1
          maximum: 400
        placements:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/CropPlacement'
        updatedAt:
          type: string
          format: date-time
    GardenLayoutResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/GardenLayout'

    PaginationMeta:
      type: object
      required: [currentPage, perPage, total, lastPage]
      properties:
        currentPage:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        lastPage:
          type: integer
          minimum: 1
    PaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_FAILED]
            message:
              type: string
              examples: [입력값을 확인해 주세요.]
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

security:
  - bearerAuth: []
