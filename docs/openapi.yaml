openapi: 3.1.0
info:
  title: 심어봄 API
  version: 1.0.0
  description: |
    현재 Laravel 12 백엔드에 구현되어 테스트되는 심어봄 API 계약입니다.
    계획 단계의 엔드포인트는 포함하지 않습니다.
servers:
  - url: http://localhost:8000/api/v1
    description: Laravel 로컬 개발 서버
tags:
  - name: System
    description: API 상태와 운영 점검
  - name: Auth
    description: 회원 인증
  - name: Crops
    description: 공개 작물 기준 데이터
  - name: Spaces
    description: 사용자 재배 공간
  - name: Seasons
    description: 사용자 재배 시즌
  - name: Layouts
    description: 텃밭 시즌별 격자와 작물 배치
  - name: Tasks
    description: 앞으로 수행할 재배 일정
  - name: Records
    description: 실제 수행·관찰 기록

  - name: Watering
    description: 시즌별 작물 물주기 일정과 완료·미루기 이력

paths:
  /health:
    get:
      tags: [System]
      summary: API 상태 확인
      operationId: getHealth
      security: []
      responses:
        '200':
          description: API가 요청을 처리할 수 있음
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, apiVersion]
                    properties:
                      status:
                        type: string
                        const: ok
                      apiVersion:
                        type: string
                        const: v1
  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      summary: SPA 인증용 CSRF 쿠키 발급
      operationId: getCsrfCookie
      servers:
        - url: http://localhost:8000
          description: Laravel 로컬 개발 서버 루트
      security: []
      responses:
        '204':
          description: CSRF 쿠키 발급 성공
  /auth/register:
    post:
      tags: [Auth]
      summary: 회원가입
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입과 세션 시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인과 세션 시작 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /auth/logout:
    post:
      tags: [Auth]
      summary: 현재 로그인 세션 종료
      operationId: logout
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /me:
    get:
      tags: [Auth]
      summary: 로그인 사용자 조회
      operationId: getCurrentUser
      responses:
        '200':
          description: 사용자 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /crops:
    get:
      tags: [Crops]
      summary: 작물 목록 조회
      operationId: listCrops
      security: []
      parameters:
        - name: query
          in: query
          description: 이름, 과명과 설명 검색어
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/CropCategory'
        - name: space
          in: query
          schema:
            $ref: '#/components/schemas/GrowingSpaceType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 작물 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Crop'
  /crops/{cropId}:
    get:
      tags: [Crops]
      summary: 작물 한 건 조회
      operationId: getCrop
      security: []
      parameters:
        - $ref: '#/components/parameters/CropId'
      responses:
        '200':
          description: 작물 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Crop'
        '404':
          $ref: '#/components/responses/NotFound'

  /crop-sources:
    get:
      tags: [Crops]
      summary: 작물 기준정보 출처 목록 조회
      operationId: listCropSources
      security: []
      responses:
        '200':
          description: 출처 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CropSource'

  /locations/geocode:
    get:
      tags: [Locations]
      summary: 카카오 주소를 위도·경도로 변환
      operationId: geocodeAddress
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 255
      responses:
        '200':
          description: 주소 변환 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [address, latitude, longitude]
                    properties:
                      address: { type: string }
                      latitude: { type: number }
                      longitude: { type: number }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 주소 검색 설정 또는 외부 서비스 오류

  /spaces:
    get:
      tags: [Spaces]
      summary: 내 재배 공간 목록 조회
      operationId: listSpaces
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 공간 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GrowingSpace'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Spaces]
      summary: 재배 공간 등록
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSpaceInput'
      responses:
        '201':
          description: 공간 등록 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      tags: [Spaces]
      summary: 내 재배 공간 한 건 조회
      operationId: getSpace
      responses:
        '200':
          description: 공간 조회 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Spaces]
      summary: 재배 공간 일부 수정
      operationId: updateSpace
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSpacePatch'
      responses:
        '200':
          description: 공간 수정 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSpaceResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
    delete:
      tags: [Spaces]
      summary: 재배 공간 삭제
      operationId: deleteSpace
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: 공간 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'

  /seasons:
    get:
      tags: [Seasons]
      summary: 내 재배 시즌 목록 조회
      operationId: listSeasons
      parameters:
        - name: spaceId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GrowingSeasonStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 시즌 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GrowingSeason'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Seasons]
      summary: 재배 시즌 등록
      operationId: createSeason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSeasonInput'
      responses:
        '201':
          description: 시즌 등록 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /seasons/{seasonId}:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Seasons]
      summary: 내 재배 시즌 한 건 조회
      operationId: getSeason
      responses:
        '200':
          description: 시즌 조회 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Seasons]
      summary: 재배 시즌 일부 수정
      operationId: updateSeason
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrowingSeasonPatch'
      responses:
        '200':
          description: 시즌 수정 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrowingSeasonResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
    delete:
      tags: [Seasons]
      summary: 재배 시즌 삭제
      operationId: deleteSeason
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: 시즌 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'

  /layouts:
    get:
      tags: [Layouts]
      summary: 내 시즌 격자와 작물 배치 목록 조회
      operationId: listLayouts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 격자 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/GardenLayout'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /seasons/{seasonId}/layout:
    parameters:
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [Layouts]
      summary: 시즌 격자와 작물 배치 조회
      operationId: getSeasonLayout
      responses:
        '200':
          description: 격자 조회 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenLayoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Layouts]
      summary: 시즌 격자와 전체 작물 배치 저장
      operationId: putSeasonLayout
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GardenLayoutInput'
      responses:
        '200':
          description: 기존 격자 교체 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenLayoutResponse'
        '201':
          description: 새 격자 생성 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GardenLayoutResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
    delete:
      tags: [Layouts]
      summary: 시즌 격자와 작물 배치 삭제
      operationId: deleteSeasonLayout
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: 격자 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'

  /tasks:
    get:
      tags: [Tasks]
      summary: 로그인 사용자의 전체 재배 일정 목록 조회
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 소유한 일정 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CultivationTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /seasons/{seasonId}/tasks:
    get:
      tags: [Tasks]
      summary: 시즌 재배 일정 목록 조회
      operationId: listSeasonTasks
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: 일정 목록 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CultivationTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Tasks]
      summary: 시즌의 재배 일정 전체 삭제
      operationId: deleteSeasonTasks
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CultivationTaskBulkDelete'
      responses:
        '204':
          description: 시즌 일정 전체 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /seasons/{seasonId}/tasks/generate:
    post:
      tags: [Tasks]
      summary: 시즌 기준 재배 일정 자동 생성
      description: 텃밭은 현재 격자 버전, 화분·베란다는 현재 시즌 버전을 If-Match로 전송합니다.
      operationId: generateSeasonTasks
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: 일정 자동 생성 성공
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CultivationTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [Tasks]
      summary: 재배 일정 수정 또는 완료 처리
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CultivationTaskPatch'
      responses:
        '200':
          description: 일정 수정 성공
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
